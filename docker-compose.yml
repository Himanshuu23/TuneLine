version: '3.9'

networks:
  appnet:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - appnet
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  server1:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - PORT=11011
      - REDIS_ADDR=redis:6379
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-AIzaSyA8TG3tJ3hcgrD6u8iuD0bY3kcOBwYCHk4}
    networks:
      - appnet
    depends_on:
      - redis

  server2:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - PORT=11011
      - REDIS_ADDR=redis:6379
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-AIzaSyA8TG3tJ3hcgrD6u8iuD0bY3kcOBwYCHk4}
    networks:
      - appnet
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2
    networks:
      - appnet

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost/ws
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-secret-key-change-in-production}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    networks:
      - appnet
    depends_on:
      - nginx

volumes:
  redis_data:
